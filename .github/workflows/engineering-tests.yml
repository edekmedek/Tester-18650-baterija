name: Battery tester engineering checks
on:
  push:
    paths:
      - 'engineering/**'
      - '.github/workflows/engineering-tests.yml'
  pull_request:
    paths:
      - 'engineering/**'
      - '.github/workflows/engineering-tests.yml'
  workflow_dispatch:

jobs:
  engineering-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q engineering
      - name: Run all engineering unit tests
        run: python -m unittest discover -s engineering -p 'test_*.py' -v
