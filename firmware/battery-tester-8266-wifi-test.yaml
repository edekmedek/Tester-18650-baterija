# Dokumentacijska kopija aktualnog ESPHome firmwarea koji je korisnik dostavio 15.10.2026.
# Promjena iskljucivo radi sigurnosti JAVNOG GitHub repozitorija:
# Wi-Fi fallback AP password zamijenjen je !secret battery_tester_fallback_password.
# Za eventualno flashanje unijeti tu vrijednost u lokalni secrets.yaml.
# NIKAKVE druge funkcionalne promjene nisu namjerno uvedene. OLED vise nije prisutan.
esphome:
  name: battery-tester-8266-wifi-test
  friendly_name: Battery Tester
  on_boot:
    priority: -100
    then:
      - switch.turn_off: relay
      - lambda: |-
          id(low_voltage_seconds) = 0;
          if (id(test_running)) {
            id(test_running) = false;
            id(status_code) = 4;
          }

esp8266:
  board: nodemcuv2
  restore_from_flash: true

preferences:
  flash_write_interval: 60s

logger:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 0s

  ap:
    ssid: "Battery Tester Fallback"
    password: !secret battery_tester_fallback_password

captive_portal:

i2c:
  sda: GPIO2
  scl: GPIO5
  scan: true
  frequency: 100kHz

globals:
  - id: test_running
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: test_mah
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: test_wh
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: test_seconds
    type: int
    restore_value: yes
    initial_value: '0'

  - id: low_voltage_seconds
    type: int
    restore_value: no
    initial_value: '0'

  - id: status_code
    type: int
    restore_value: yes
    initial_value: '0'

switch:
  - platform: gpio
    pin: GPIO14
    name: "Relej"
    id: relay
    restore_mode: ALWAYS_OFF

number:
  - platform: template
    name: "Cutoff napon"
    id: cutoff_voltage
    unit_of_measurement: "V"
    device_class: voltage
    min_value: 2.50
    max_value: 4.20
    step: 0.05
    initial_value: 3.00
    restore_value: true
    optimistic: true

button:
  - platform: template
    name: "Pokreni praznjenje"
    icon: mdi:play
    on_press:
      - if:
          condition:
            lambda: |-
              return !isnan(id(battery_voltage).state) &&
                     id(battery_voltage).state > id(cutoff_voltage).state;
          then:
            - switch.turn_off: relay
            - lambda: |-
                id(test_mah) = 0.0;
                id(test_wh) = 0.0;
                id(test_seconds) = 0;
                id(low_voltage_seconds) = 0;
                id(status_code) = 1;
                id(test_running) = true;
            - delay: 500ms
            - switch.turn_on: relay
          else:
            - switch.turn_off: relay
            - lambda: |-
                id(test_running) = false;
                id(status_code) = 5;

  - platform: template
    name: "Prekini praznjenje"
    icon: mdi:stop
    on_press:
      - lambda: |-
          id(status_code) = 3;
      - script.execute: stop_test

  - platform: restart
    name: "Restart"

binary_sensor:
  - platform: status
    name: "Online"

sensor:
  - platform: adc
    pin: A0
    id: battery_adc
    update_interval: 200ms
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 5

  - platform: template
    name: "Napon baterije"
    id: battery_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    lambda: |-
      return id(battery_adc).state * 9.5079;

  - platform: ina219
    address: 0x40
    shunt_resistance: 0.11425 ohm
    max_voltage: 16.0V
    max_current: 3.2A
    update_interval: 500ms

    bus_voltage:
      name: "INA219 napon"
      id: ina219_bus_voltage
      unit_of_measurement: "V"
      accuracy_decimals: 3

    shunt_voltage:
      name: "INA219 shunt napon"
      id: ina219_shunt_voltage
      unit_of_measurement: "V"
      accuracy_decimals: 4

    current:
      name: "INA219 struja"
      id: ina219_current
      unit_of_measurement: "A"
      accuracy_decimals: 3

    power:
      name: "INA219 snaga"
      id: ina219_power
      unit_of_measurement: "W"
      accuracy_decimals: 3

  - platform: template
    name: "Struja baterije"
    id: battery_current
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 500ms
    lambda: |-
      if (isnan(id(ina219_current).state)) {
        return NAN;
      }
      return fabsf(id(ina219_current).state);

  - platform: template
    name: "Snaga praznjenja"
    id: discharge_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 500ms
    lambda: |-
      if (isnan(id(battery_voltage).state) ||
          isnan(id(battery_current).state)) {
        return NAN;
      }
      return id(battery_voltage).state * id(battery_current).state;

  - platform: template
    name: "Kapacitet"
    id: capacity_mah
    unit_of_measurement: "mAh"
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(test_mah);

  - platform: template
    name: "Energija"
    id: energy_wh
    unit_of_measurement: "Wh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 1s
    lambda: |-
      return id(test_wh);

  - platform: template
    name: "Vrijeme testa"
    id: test_time
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      return id(test_seconds);

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 10s

  - platform: uptime
    name: "Uptime"
    update_interval: 10s

text_sensor:
  - platform: template
    name: "Status testa"
    id: test_status
    update_interval: 1s
    lambda: |-
      switch (id(status_code)) {
        case 1: return {"Praznjenje u tijeku"};
        case 2: return {"Zavrseno - cutoff"};
        case 3: return {"Rucno prekinuto"};
        case 4: return {"Prekinuto restartom"};
        case 5: return {"Napon prenizak ili neispravan"};
        default: return {"Spreman"};
      }

  - platform: wifi_info
    ip_address:
      name: "IP adresa"
    ssid:
      name: "WiFi mreza"
    bssid:
      name: "WiFi pristupna tocka"
    mac_address:
      name: "MAC adresa"

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(test_running);
          then:
            - lambda: |-
                const float current = id(battery_current).state;
                const float voltage = id(battery_voltage).state;

                if (!isnan(current) && !isnan(voltage)) {
                  id(test_mah) += current * 1000.0f / 3600.0f;
                  id(test_wh) += voltage * current / 3600.0f;
                  id(test_seconds) += 1;
                }

                if (!isnan(voltage) &&
                    voltage <= id(cutoff_voltage).state) {
                  id(low_voltage_seconds) += 1;
                } else {
                  id(low_voltage_seconds) = 0;
                }

            - if:
                condition:
                  lambda: |-
                    return id(low_voltage_seconds) >= 5;
                then:
                  - lambda: |-
                      id(status_code) = 2;
                  - script.execute: stop_test

script:
  - id: stop_test
    mode: restart
    then:
      - switch.turn_off: relay
      - lambda: |-
          id(test_running) = false;
          id(low_voltage_seconds) = 0;
